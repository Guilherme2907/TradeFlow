server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health probe for Kubernetes Liveness/Readiness
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # SPA fallback so React routes & OIDC /auth/callback work on reload
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache immutable Vite hashed assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
