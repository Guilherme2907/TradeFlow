# ==============================================================================
# TradeFlow Kubernetes Local Testing Manifest (Docker Desktop)
# Pre-configured to use the local Docker image (tradeflow-api:local)
# and In-Memory database for instant zero-dependency testing.
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: tradeflow-config
  namespace: default
data:
  ASPNETCORE_ENVIRONMENT: "Development"
  Host__ShutdownTimeoutSeconds: "25"
  UseInMemoryDatabase: "false"
  ConnectionStrings__Database: "Host=host.docker.internal;Port=5432;Database=tradeflow;Username=postgres;Password=postgres"
  ConnectionStrings__Redis: "host.docker.internal:6379"
  ConnectionStrings__RabbitMq: "amqp://guest:guest@tradeflow-rabbitmq-svc:5672/"
  ConnectionStrings__Kafka: "tradeflow-kafka-svc:9092"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://host.docker.internal:4317"
  Authentication__Authority: "http://tradeflow-keycloak-svc:8080/realms/tradeflow"
  Authentication__Audience: "tradeflow-api"
  Authentication__RequireHttpsMetadata: "false"
  Outbox__BackgroundWorkerEnabled: "true"
  Resilience__LoadShedding__MaxConcurrentRequests: "200"
  Resilience__RateLimiting__TenantPermitLimit: "100"
  Resilience__RateLimiting__AuthPermitLimit: "15"
  Resilience__RateLimiting__WindowSeconds: "60"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradeflow-api
  namespace: default
  labels:
    app: tradeflow-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: tradeflow-api
  template:
    metadata:
      labels:
        app: tradeflow-api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
      containers:
        - name: tradeflow-api
          image: tradeflow-api:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: tradeflow-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 15
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: tradeflow-api-svc
  namespace: default
  labels:
    app: tradeflow-api
spec:
  type: LoadBalancer
  selector:
    app: tradeflow-api
  ports:
    - name: http
      port: 5022
      targetPort: http
      protocol: TCP
