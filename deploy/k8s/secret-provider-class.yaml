# ==============================================================================
# Azure Key Vault Secrets Store CSI Driver Provider (Production Secret Sync)
# Fetches secrets from Azure Key Vault using AKS Workload Identity (no static
# passwords in Git) and mirrors them into Kubernetes Secret "tradeflow-kv-secrets".
# ==============================================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-tradeflow
  namespace: default
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    # Populated by CD pipeline from Terraform output: workload_identity_client_id
    clientID: "ccb22a52-362e-4716-95e5-2e2ea23b2d7a"
    # Populated by CD pipeline from Terraform output: key_vault_name
    keyvaultName: "kv-tradeflow-dev-001"
    cloudName: "AzurePublicCloud"
    # Populated by CD pipeline from Terraform output: tenant_id
    tenantId: "99b7850d-fc38-4f8f-bcb8-a4a2a244661d"
    objects: |
      array:
        - |
          objectName: postgres-connection-string
          objectType: secret
        - |
          objectName: redis-connection-string
          objectType: secret
        - |
          objectName: application-insights-connection-string
          objectType: secret
  # Mirrors AKV secrets into a native Kubernetes Secret consumed via envFrom
  secretObjects:
    - secretName: tradeflow-kv-secrets
      type: Opaque
      data:
        - objectName: postgres-connection-string
          key: ConnectionStrings__Database
        - objectName: redis-connection-string
          key: ConnectionStrings__Redis
        - objectName: application-insights-connection-string
          key: APPLICATIONINSIGHTS_CONNECTION_STRING
