# ==============================================================================
# TradeFlow React 19 SPA Frontend Deployment + Service
# Image built from src/TradeFlow.Web/Dockerfile (Nginx non-root on port 8080)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: tradeflow-web-svc
  namespace: default
  labels:
    app: tradeflow-web
spec:
  type: ClusterIP
  selector:
    app: tradeflow-web
  ports:
    - name: http
      port: 5173
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradeflow-web
  namespace: default
  labels:
    app: tradeflow-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tradeflow-web
  template:
    metadata:
      labels:
        app: tradeflow-web
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: tradeflow-web
          image: acrtradeflowdev001.azurecr.io/tradeflow-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
