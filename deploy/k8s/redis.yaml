# ==============================================================================
# Redis 7 Alpine StatefulSet + Service for TradeFlow Kubernetes
# Uses Azure Managed Disk (PVC) for persistent cache & rate-limiting storage
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: tradeflow-redis-svc
  namespace: default
  labels:
    app: tradeflow-redis
spec:
  type: ClusterIP
  selector:
    app: tradeflow-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tradeflow-redis
  namespace: default
  labels:
    app: tradeflow-redis
spec:
  serviceName: tradeflow-redis-svc
  replicas: 1
  selector:
    matchLabels:
      app: tradeflow-redis
  template:
    metadata:
      labels:
        app: tradeflow-redis
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
