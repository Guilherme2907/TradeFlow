# ==============================================================================
# Apache Kafka 3.8 (KRaft Mode) StatefulSet + Services for TradeFlow Kubernetes
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: tradeflow-kafka-headless
  namespace: default
  labels:
    app: tradeflow-kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: tradeflow-kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: plaintext
      protocol: TCP
    - name: controller
      port: 9093
      targetPort: controller
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: tradeflow-kafka-svc
  namespace: default
  labels:
    app: tradeflow-kafka
spec:
  type: ClusterIP
  selector:
    app: tradeflow-kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: plaintext
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tradeflow-kafka
  namespace: default
  labels:
    app: tradeflow-kafka
spec:
  serviceName: tradeflow-kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: tradeflow-kafka
  template:
    metadata:
      labels:
        app: tradeflow-kafka
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: plaintext
              containerPort: 9092
              protocol: TCP
            - name: controller
              containerPort: 9093
              protocol: TCP
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@tradeflow-kafka-0.tradeflow-kafka-headless.default.svc.cluster.local:9093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://tradeflow-kafka-svc.default.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data/logs"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            tcpSocket:
              port: plaintext
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: plaintext
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
