name: TradeFlow CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ============================================================================
  # STAGE 1: Fast Feedback Gate (Build, Pure Unit Tests, Architecture Fitness)
  # ============================================================================
  fast-verification:
    name: "Stage 1: Build, Unit, Resilience & Architecture Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution (Zero Warnings Allowed)
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Execute Domain, Application, Architecture & Resilience Tests (No Docker)
        run: dotnet test --no-build --configuration Release --filter "Category!=RequiresDocker" --logger "trx"

  # ============================================================================
  # STAGE 2: Real Infrastructure Integration Gate (Testcontainers Docker Suite)
  # ============================================================================
  integration-tests:
    name: "Stage 2: Testcontainers Integration Suite (Postgres, RabbitMQ, Kafka, Redis)"
    runs-on: ubuntu-latest
    needs: fast-verification
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & Build Solution
        run: dotnet build --configuration Release

      - name: Run Real Testcontainers Integration Tests
        run: dotnet test --no-build --configuration Release --filter "Category=RequiresDocker" --logger "trx"

  # ============================================================================
  # STAGE 3: Production Packaging (Multi-Stage Docker Build & EF Migration Verification)
  # ============================================================================
  package-production-artifacts:
    name: "Stage 3: Multi-Stage Docker Image Build"
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Production Multi-Stage Docker Image
        run: docker build -t tradeflow-api:${{ github.sha }} -f Dockerfile .
