name: TradeFlow CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ============================================================================
  # STAGE 1: Fast Feedback Gate (Build, Pure Unit Tests, Architecture Fitness)
  # ============================================================================
  fast-verification:
    name: "Stage 1: Build, Unit, Resilience & Architecture Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution (Zero Warnings Allowed)
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Execute Domain, Application, Architecture & Resilience Tests (No Docker)
        run: dotnet test --no-build --configuration Release --filter "Category!=RequiresDocker" --logger "trx"

  # ============================================================================
  # STAGE 1B: Infrastructure as Code Gate (Terraform Format, Validate, TFLint & Trivy)
  # ============================================================================
  terraform-validation:
    name: "Stage 1B: Terraform Format, Validate, TFLint & Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Initialize & Validate Terraform Environments (No Backend / Zero Cloud Cost)
        run: |
          for env in dev prod; do
            echo "Validating environment: $env"
            terraform -chdir="infra/terraform/environments/$env" init -backend=false
            terraform -chdir="infra/terraform/environments/$env" validate
          done

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Initialize & Run TFLint
        working-directory: infra/terraform
        run: |
          tflint --init
          tflint --recursive

      - name: Run Trivy IaC Security Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'config'
          scan-ref: 'infra/terraform'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # ============================================================================
  # STAGE 2: Real Infrastructure Integration Gate (Testcontainers Docker Suite)
  # ============================================================================
  integration-tests:
    name: "Stage 2: Testcontainers Integration Suite (Postgres, RabbitMQ, Kafka, Redis)"
    runs-on: ubuntu-latest
    needs: fast-verification
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & Build Solution
        run: dotnet build --configuration Release

      - name: Run Real Testcontainers Integration Tests
        run: dotnet test --no-build --configuration Release --filter "Category=RequiresDocker" --logger "trx"

  # ============================================================================
  # STAGE 3: Production Packaging (Multi-Stage Docker Build & EF Migration Verification)
  # ============================================================================
  package-production-artifacts:
    name: "Stage 3: Multi-Stage Docker Image Build"
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Production Multi-Stage Docker Image
        run: docker build -t tradeflow-api:${{ github.sha }} -f Dockerfile .
